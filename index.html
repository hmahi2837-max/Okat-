<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HASNAIN</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at top, #1a1a2e, #0f0f1e);
      height: 100vh; overflow: hidden; font-family: 'Rajdhani', sans-serif;
      display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;
    }
    .name-animation {
      font-family: 'Orbitron', sans-serif; font-size: 4rem; font-weight: 900;
      position: relative; top: -200px; animation: slideDown 2s ease-out forwards;
      background: linear-gradient(45deg, #ff4d6d, #ff758f, #ffd6e0, #ff4d6d);
      background-size: 300% 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: slideDown 2s ease-out forwards, gradientMove 3s ease infinite;
      filter: drop-shadow(0 0 20px #ff4d6d);
    }
    .heart { font-size: 2.5rem; animation: pulse 1.5s infinite; margin: 15px 0; filter: drop-shadow(0 0 15px #ff4d6d); }
    @keyframes slideDown { to { top: 0; } }
    @keyframes gradientMove { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.4); } }
    #pic {
      width: 0px; height: 0px; border-radius: 25px; margin: 20px 0;
      transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55); object-fit: cover;
      border: 3px solid #ff4d6d; box-shadow: 0 0 40px rgba(255, 77, 109, 0.8), 0 0 80px rgba(255, 77, 109, 0.4);
      display: none;
    }
    #pic.show { display: block; }
    .size-small { width: 180px; height: 180px; }
    .size-large { width: 320px; height: 320px; }
    #btn {
      font-family: 'Orbitron', sans-serif; padding: 18px 35px; font-size: 1.3rem; font-weight: 700;
      background: linear-gradient(45deg, #ff4d6d, #ff006e); border: 2px solid #ff758f;
      border-radius: 50px; color: white; cursor: pointer; margin-top: 25px;
      box-shadow: 0 0 20px rgba(255, 77, 109, 0.6), inset 0 0 20px rgba(255,255,255,0.1);
      transition: 0.3s; text-transform: uppercase; letter-spacing: 2px;
    }
    #btn:hover { transform: scale(1.08) translateY(-2px); box-shadow: 0 0 40px rgba(255, 77, 109, 0.9), inset 0 0 20px rgba(255,255,255,0.2); }
    #message {
      font-family: 'Rajdhani', sans-serif; font-size: 2rem; font-weight: 700; margin: 25px 0;
      min-height: 50px; text-align: center; padding: 0 20px;
      text-shadow: 0 0 20px #ff4d6d, 0 0 40px #ff4d6d; letter-spacing: 1px;
    }
    .hearts-container, .emoji-rain { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
    .floating-heart, .falling-emoji { position: absolute; font-size: 1.8rem; animation: floatUp 3s linear forwards; }
    .falling-emoji { animation: emojiFall 4s linear forwards; }
    @keyframes floatUp { 0% { transform: translateY(100vh) scale(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; } }
    @keyframes emojiFall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
  </style>
</head>
<body>
  <div class="hearts-container" id="heartsContainer"></div>
  <div class="emoji-rain" id="emojiRain"></div>
  <div class="name-animation">HASNAIN</div>
  <div class="heart">❤️</div>
  
  <img id="pic" src="./profile.jpg" alt="Hasnain">
  <div id="message"></div>
  <button id="btn">Hasnain ko dekhna hai to click karo</button>

  <script>
    let clickCount = 0;
    const btn = document.getElementById('btn');
    const pic = document.getElementById('pic');
    const message = document.getElementById('message');
    const heartsContainer = document.getElementById('heartsContainer');
    const emojiRain = document.getElementById('emojiRain');
    
    function animateSize() {
      pic.classList.remove('size-small', 'size-large');
      const randomSize = Math.random() > 0.5 ? 'size-large' : 'size-small';
      pic.classList.add(randomSize);
    }
    function createHearts() {
      const hearts = ['❤️','💖','💕','💗','💓','💘','💝','❤️‍🩹','😍','🥰','💋','✨'];
      for(let i = 0; i < 40; i++) {
        const heart = document.createElement('div');
        heart.className = 'floating-heart';
        heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDelay = Math.random() * 2 + 's';
        heartsContainer.appendChild(heart);
        setTimeout(() => heart.remove(), 3000);
      }
    }
    function emojiRainFall() {
      const emojis = ['❤️','💖','💕','💗','💓','💘','💝','❤️‍🩹','😍','🥰','💋','✨','🔥','💯','🌟','💫','⚡','👑','🎯','💎'];
      for(let i = 0; i < 150; i++) {
        setTimeout(() => {
          const emoji = document.createElement('div');
          emoji.className = 'falling-emoji';
          emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
          emoji.style.left = Math.random() * 100 + 'vw';
          emoji.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
          emojiRain.appendChild(emoji);
          setTimeout(() => emoji.remove(), 4000);
        }, i * 20);
      }
    }
    btn.addEventListener('click', () => {
      clickCount++;
      if(clickCount === 1) {
        createHearts();
        message.innerHTML = '';
        btn.innerText = 'PHIR CLICK KARO 😉';
      } 
      else if(clickCount === 2) {
        emojiRainFall();
        message.innerHTML = 'WELL ❤️‍🩹 COME ✨💖🥰💋💕💘😍❤️💗';
        btn.innerText = 'AUR CLICK KARO...';
      } 
      else if(clickCount === 3) {
        message.innerHTML = 'WAIQA HE AP HASNAIN KO DEKHNY AY HA? 🤔';
        btn.innerText = 'HAAN! DIKHAO';
      }
      else if(clickCount === 4) {
        message.innerHTML = 'APNI OKAT MA RAH TERY GHULAM NAI 😤';
        btn.innerText = 'ACHA SORRY, AAGAY CHALEIN?';
      }
      else if(clickCount === 5) {
        message.innerHTML = 'BAHI AGY JANY SA PHLY AIK BAR MASHALLAH BOLO 🙏✨';
        btn.innerText = 'MASHALLAH BOL DIYA, AB DIKHAO';
      }
      else if(clickCount === 6) {
        pic.classList.add('show', 'size-large');
        message.innerHTML = 'LE JANI, AA GAYA HASNAIN 😎❤️ MASHALLAH';
        btn.innerText = 'SIZE CHANGE KARO';
        animateSize();
        createHearts();
      } 
      else {
        animateSize();
        message.innerHTML = 'KABHI CHOTA, KABHI BARA 😂❤️';
        createHearts();
      }
    });
  </script>
</body>
</html>
